# Dependabot: weekly pull requests that keep dependencies and GitHub Actions
# up to date. Each one runs through CI like any other PR; merging deploys.
#
# Minor and patch updates are grouped into one PR per folder to limit noise;
# major updates come one by one, since they can need code changes.

version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  # Also bumps the commit pinned for superfly/flyctl-actions in ci.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The Node base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
