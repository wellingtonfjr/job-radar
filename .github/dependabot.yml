# Dependabot: weekly pull requests that keep dependencies and GitHub Actions
# up to date. Each one runs through CI like any other PR; merging deploys.
#
# Packages that must move together (a tool and its plugins) are grouped, so
# their major updates arrive in one PR that can actually pass CI. Other minor
# and patch updates are grouped per folder; other majors come one by one.
#
# Some majors are ignored on purpose:
# - Node (image) and @types/node: both track the Node LTS line chosen in #38
#   (Node 26). The types must match the Node version production runs, and CI
#   pins it too, so the runtime is upgraded deliberately, all in one PR.

version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # The first group a package matches wins, so the tool families come first.
    groups:
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "globals"]
      vite:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*"]
      frontend-minor-and-patch:
        update-types: [minor, patch]

  # Also bumps the commit pinned for superfly/flyctl-actions in ci.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The Node base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
