# Fly.io deployment of job-radar: the Dockerfile says WHAT runs (one image
# with the API and the built frontend); this file says HOW and WHERE it runs.
#
# Exactly one always-on machine: the SQLite database on the volume and the
# in-process ingestion scheduler must never run twice.

app = "radar-de-vagas"            # → https://radar-de-vagas.fly.dev
primary_region = "gru"            # São Paulo

[build]
  # Uses ./Dockerfile.

[http_service]
  internal_port = 8080            # must match PORT in the Dockerfile
  force_https = true
  auto_stop_machines = "off"      # always on (ingestion runs in-process)
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"              # not rate-limited, so checks never get 429
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"          # time to start and open the database

[[mounts]]
  source = "job_radar_data"       # the volume holding the SQLite database
  destination = "/data"           # DB_PATH=/data/job-radar.db in the Dockerfile
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
